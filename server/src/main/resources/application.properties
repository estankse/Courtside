server.port=${PORT:8080}
server.address=0.0.0.0
spring.application.name=courtside
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:../tmp/runtime/courtside;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.jackson.deserialization.fail-on-unknown-properties=false
server.error.include-message=never
server.tomcat.max-http-form-post-size=1MB
courtside.seed-demo=${SEED_DEMO:true}
